services:
  - type: web
    name: quant-price-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 price_api:app
    healthCheckPath: /readyz

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FETCH_TIMEOUT
        value: "8"
      - key: CACHE_TTL
        value: "45"
      - key: MAX_SYMBOLS_PER_REQUEST
        value: "20"
      - key: MACRO_CACHE_TTL_SECONDS
        value: "21600"
      - key: MACRO_AUTO_REFRESH_SECONDS
        value: "21600"
      - key: MACRO_AUTO_REFRESH_INITIAL_DELAY
        value: "90"
      # Cho phép mọi origin gọi API (vì HTML có thể serve từ bất kỳ đâu)
      - key: ALLOWED_ORIGINS
        value: "*"

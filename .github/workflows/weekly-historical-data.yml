name: Weekly historical market data

on:
  schedule:
    - cron: "20 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-historical-data
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download real historical OHLC
        run: python scripts/download_history.py
      - name: Commit weekly snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/history.json
          if git diff --cached --quiet; then
            echo "No historical data changes."
          else
            git commit -m "data: refresh weekly historical candles"
            git push origin HEAD:main
          fi

name: Validate Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pandas requests openpyxl
      - name: Compile application modules
        run: python -m py_compile price_api.py macro_data.py ptkt.py
      - name: Run macro data tests
        run: python -m unittest discover -s tests -v

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs directory
        run: |
          test -d ./docs
          ls -la ./docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Wait for Pages artifact registration
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const listArtifacts = async () => {
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100
              });
              return response.data.artifacts.find(item =>
                item.name === "github-pages" && !item.expired
              );
            };

            let artifact = null;
            for (let attempt = 1; attempt <= 12; attempt++) {
              artifact = await listArtifacts();
              if (artifact) break;
              core.info(`Pages artifact not visible yet (attempt ${attempt}/12); waiting 3 seconds`);
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            if (!artifact) {
              throw new Error("Artifact github-pages was not visible after 36 seconds.");
            }

            core.info(`Pages artifact visible: ${artifact.id}; waiting 20 seconds for Pages metadata propagation.`);
            await new Promise(resolve => setTimeout(resolve, 20000));

            for (let attempt = 1; attempt <= 4; attempt++) {
              artifact = await listArtifacts();
              if (artifact) {
                core.info(`Pages artifact confirmed after propagation: ${artifact.id}`);
                return;
              }
              core.info(`Artifact metadata not stable yet (check ${attempt}/4); waiting 5 seconds`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error("Pages artifact disappeared or remained unavailable after the propagation wait.");

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "scripts/generate_paper_snapshot.py"
  schedule:
    # 00:00 Vietnam time (GMT+7)
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate public Paper snapshot
        env:
          FOREX_API_BASE: ${{ vars.FOREX_API_BASE }}
          FOREX_API_KEY: ${{ secrets.FOREX_API_KEY }}
        run: |
          test -n "$FOREX_API_BASE" || (echo "Missing Actions variable FOREX_API_BASE" && exit 1)
          test -n "$FOREX_API_KEY" || (echo "Missing Actions secret FOREX_API_KEY" && exit 1)
          python scripts/generate_paper_snapshot.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/paper-snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "chore: refresh public Paper market snapshot"
            git push
          fi

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs directory
        run: |
          test -d ./docs
          ls -la ./docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
